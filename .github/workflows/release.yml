name: Release

# Push a tag like v1.2.0 for a release or v1.2.0-beta.1 for a beta.
# Notes come from the tag message (git tag -a v1.2.0 -m "..."), or from the commits since the last tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the test build
        default: 0.0.0-beta.1

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Read version from tag
        id: version
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-beta.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$SIGNING_KEYSTORE"
          ./gradlew :app:assembleRelease -PversionName=${{ needs.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "Muuusic-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Muuusic-*.apk

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 fakeroot
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy-plugin-appimage" https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/linuxdeploy-plugin-appimage"

      - name: Build .deb and AppImage
        run: |
          ./gradlew :desktop:packageDeb :desktop:createDistributable -PversionName=${{ needs.version.outputs.name }}
          PATH="$RUNNER_TEMP:$PATH" desktop/packaging/linux.sh "${{ needs.version.outputs.name }}" "$RUNNER_TEMP/linuxdeploy"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktop/build/release/*

  publish:
    if: github.event_name == 'push'
    needs: [version, android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # checkout turns annotated tags into plain ones; fetch them again to read their messages.
      - run: git fetch --force --tags

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == *-beta.* ]]; then
            previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          else
            previous=$(git tag --merged "$tag^" --sort=-v:refname 2>/dev/null | grep -v -- '-beta\.' | head -1 || true)
          fi
          range=${previous:+$previous..}$tag
          {
            if [[ "$(git cat-file -t "$tag")" == "tag" ]]; then
              git tag -l --format='%(contents)' "$tag"
            else
              # Commits that only touch the README or CI aren't news for people using the app.
              git log "$range" --no-merges --perl-regexp --author='^((?!renovate).)*$' --committer='^((?!hosted@weblate\.org).)*$' --pretty='- %s' -- . ':!README.md' ':!.github'
              translations=$(git log "$range" --no-merges --committer=hosted@weblate.org --oneline | wc -l)
              if [[ "$translations" -gt 0 ]]; then echo "- Translation updates"; fi
              updates=$(git log "$range" --no-merges --author=renovate --oneline | wc -l)
              if [[ "$updates" -eq 1 ]]; then echo "- 1 dependency update"; elif [[ "$updates" -gt 1 ]]; then echo "- $updates dependency updates"; fi
            fi
            if [[ -n "$previous" ]]; then
              echo
              echo "**Changes:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$tag"
            fi
          } > notes.md
          cat notes.md

      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--notes-file notes.md --title "Muuusic ${{ needs.version.outputs.name }}")
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
