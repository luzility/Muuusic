[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
material3 = "1.5.0-beta01"
materialIcons = "1.7.8"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
coreKtx = "1.19.1"
media3 = "1.11.1"
room = "2.8.5"
coil = "3.6.3"
okhttp = "4.12.0"
newpipe = "v0.26.5"
materialKolor = "5.0.1"
